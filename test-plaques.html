<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Preview Ingame Plaques & Top 6-15 Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #080c14;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
}
.test-section {
    width: 100%;
    max-width: 1350px;
}
h2 {
    font-family: 'Cinzel', serif;
    color: #ffd43b;
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.4rem;
}
.plaques-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
}
.plaque-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 10px;
    background: rgba(18, 25, 42, 0.85);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    width: 250px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.plaque-tier-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: #94a3b8;
}

/* LƯỚI THẺ TOP 6 - TOP 15 */
.grid-elite-top10 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    width: 100%;
}

.elite-member-card {
    background: linear-gradient(180deg, rgba(22, 31, 52, 0.95) 0%, rgba(11, 16, 28, 0.98) 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.elite-member-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 0.3s ease;
}

.elite-member-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 212, 59, 0.5);
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), 0 0 25px rgba(255, 212, 59, 0.22);
}

.elite-member-card:hover::before {
    opacity: 1;
}

/* Góc kim loại công nghệ (Tech Corner Brackets) */
.card-corner {
    position: absolute;
    width: 8px;
    height: 8px;
    border-color: rgba(255, 212, 59, 0.5);
    pointer-events: none;
    transition: all 0.3s ease;
}
.corner-tl { top: 4px; left: 4px; border-top: 2px solid; border-left: 2px solid; }
.corner-tr { top: 4px; right: 4px; border-top: 2px solid; border-right: 2px solid; }
.corner-bl { bottom: 4px; left: 4px; border-bottom: 2px solid; border-left: 2px solid; }
.corner-br { bottom: 4px; right: 4px; border-bottom: 2px solid; border-right: 2px solid; }

.elite-member-card:hover .card-corner {
    border-color: #ffd43b;
    width: 12px;
    height: 12px;
}

/* Thanh đầu thẻ: Khiên hạng và Ải/Tháp */
.elite-card-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
}

/* Khiên huy hiệu thứ hạng (Ornate Rank Shield) */
.elite-rank-shield {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 900;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
}
.rank-shield-diamond {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.3) 0%, rgba(3, 105, 161, 0.4) 100%);
    border: 1px solid #38bdf8;
    color: #e0f2fe;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
}
.rank-shield-gold {
    background: linear-gradient(135deg, rgba(234, 179, 8, 0.3) 0%, rgba(161, 98, 7, 0.4) 100%);
    border: 1px solid #facc15;
    color: #fef08a;
    text-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
}
.rank-shield-silver {
    background: linear-gradient(135deg, rgba(203, 213, 225, 0.25) 0%, rgba(100, 116, 139, 0.35) 100%);
    border: 1px solid #cbd5e1;
    color: #f8fafc;
    text-shadow: 0 0 8px rgba(203, 213, 225, 0.7);
}

/* Cặp viên ngọc Ải & Tháp */
.elite-milestones-plate {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
}
.milestone-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1.5px 6px;
    border-radius: 4px;
    white-space: nowrap;
}
.pill-stage {
    background: rgba(234, 88, 12, 0.18);
    color: #fdba74;
    border: 1px solid rgba(251, 146, 60, 0.3);
}
.pill-stage i { color: #f97316; }
.pill-tower {
    background: rgba(56, 189, 248, 0.18);
    color: #7dd3fc;
    border: 1px solid rgba(56, 189, 248, 0.3);
}
.pill-tower i { color: #38bdf8; }

/* Avatar trung tâm */
.elite-avatar-container {
    position: relative;
    width: 68px;
    height: 68px;
    margin: 4px auto 10px auto;
}
.elite-avatar-ring {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 2.5px;
    background: linear-gradient(135deg, rgba(255, 212, 59, 0.6) 0%, rgba(56, 189, 248, 0.6) 100%);
    box-shadow: 0 0 14px rgba(0, 0, 0, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.elite-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #0a0f1d;
    display: block;
}
.elite-member-card:hover .elite-avatar-ring {
    transform: scale(1.08);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
}

/* Tên thành viên */
.elite-name-text {
    font-family: var(--font-heading);
    font-size: 0.88rem;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    position: relative;
    z-index: 1;
}

/* Hộp Lực chiến */
.elite-power-card-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 212, 59, 0.25);
    border-radius: 20px;
    padding: 3px 12px;
    margin-bottom: 8px;
    width: 90%;
    position: relative;
    z-index: 1;
}
.power-bolt-icon {
    color: #ffd43b;
    font-size: 0.8rem;
    filter: drop-shadow(0 0 5px #ffd43b);
}
.power-number-text {
    font-family: 'Cinzel', serif;
    font-size: 0.98rem;
    font-weight: 900;
    color: #fef08a;
    letter-spacing: 0.5px;
}

/* Huy hiệu Danh hiệu & Ghi chú */
.elite-tags-row {
    display: flex;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 10px;
    min-height: 22px;
    position: relative;
    z-index: 1;
}
.tag-badge {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    white-space: nowrap;
}
.tag-title {
    background: rgba(168, 85, 247, 0.2);
    color: #d8b4fe;
    border: 1px solid rgba(168, 85, 247, 0.4);
}
.tag-note {
    background: rgba(34, 197, 94, 0.18);
    color: #86efac;
    border: 1px solid rgba(34, 197, 94, 0.35);
}

/* Nút Xem Đội Hình Gaming */
.elite-action-btn {
    width: 100%;
    padding: 7px 10px;
    border-radius: 8px;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #e0f2fe;
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
    overflow: hidden;
    transition: all 0.25s ease;
    margin-top: auto;
    z-index: 1;
}
.elite-action-btn:hover {
    background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    color: #04152d;
    border-color: #38bdf8;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.45);
}
</style>
</head>
<body>

    <!-- 1. KIỂM TRA 5 DANH HIỆU INGAME -->
    <div class="test-section">
        <h2>BỐ CỤC 5 DANH HIỆU INGAME THEO YÊU CẦU MỚI</h2>
        <div class="plaques-row" id="plaques-row"></div>
    </div>

    <!-- 2. KIỂM TRA LƯỚI THẺ TOP 6 ĐẾN TOP 15 -->
    <div class="test-section">
        <h2>THẬP ĐẠI TINH ANH BANG HỘI (TOP 6 — TOP 15) • 10 THẺ</h2>
        <div class="grid-elite-top10" id="elite-grid"></div>
    </div>

    <script>
    function renderPlaqueSvg(tier, mainTitle) {
        const configs = {
            platinum: {
                cLight: '#f0f9ff', cMid: '#38bdf8', cDark: '#0284c7',
                cBg1: '#0c223f', cBg2: '#040d1a',
                strokeColor: '#7dd3fc', textStroke: '#021024',
                wingColor: '#38bdf8', gemColor: '#38bdf8', id: 'plat'
            },
            darkgold: {
                cLight: '#fef9c3', cMid: '#eab308', cDark: '#854d0e',
                cBg1: '#261b0d', cBg2: '#0d0903',
                strokeColor: '#facc15', textStroke: '#0d0802',
                wingColor: '#ca8a04', gemColor: '#eab308', id: 'darkg'
            },
            gold: {
                cLight: '#fffbeb', cMid: '#f59e0b', cDark: '#b45309',
                cBg1: '#351c04', cBg2: '#130801',
                strokeColor: '#fbbf24', textStroke: '#240a02',
                wingColor: '#f59e0b', gemColor: '#fbbf24', id: 'gold'
            },
            silver: {
                cLight: '#ffffff', cMid: '#cbd5e1', cDark: '#64748b',
                cBg1: '#1e293b', cBg2: '#090d16',
                strokeColor: '#e2e8f0', textStroke: '#0f172a',
                wingColor: '#94a3b8', gemColor: '#cbd5e1', id: 'silv'
            },
            bronze: {
                cLight: '#ffedd5', cMid: '#fb923c', cDark: '#c2410c',
                cBg1: '#361506', cBg2: '#130601',
                strokeColor: '#fdba74', textStroke: '#240802',
                wingColor: '#ea580c', gemColor: '#f97316', id: 'brz'
            }
        };

        const c = configs[tier] || configs.gold;

        return `
        <svg class="ingame-badge-svg" viewBox="0 0 240 64" width="240" height="64" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="p-text-${c.id}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="30%" stop-color="${c.cLight}"/>
                    <stop offset="70%" stop-color="${c.cMid}"/>
                    <stop offset="100%" stop-color="${c.cDark}"/>
                </linearGradient>
                <linearGradient id="p-border-${c.id}" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${c.cLight}"/>
                    <stop offset="50%" stop-color="${c.cMid}"/>
                    <stop offset="100%" stop-color="${c.cDark}"/>
                </linearGradient>
                <linearGradient id="p-bg-${c.id}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${c.cBg1}"/>
                    <stop offset="50%" stop-color="${c.cBg2}"/>
                    <stop offset="100%" stop-color="${c.cBg1}"/>
                </linearGradient>
                <filter id="p-glow-${c.id}" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="${c.cMid}" flood-opacity="0.45"/>
                </filter>
            </defs>

            <!-- CÁNH CHIẾN BINH HAI BÊN -->
            <g class="badge-wings" filter="url(#p-glow-${c.id})">
                <path d="M 90 22 C 70 12, 42 8, 16 16 C 28 22, 42 26, 58 28 C 36 28, 20 33, 10 41 C 24 42, 44 42, 66 39 C 48 44, 32 50, 24 56 C 42 54, 64 49, 85 40 Z" 
                      fill="url(#p-border-${c.id})" opacity="0.9"/>
                <path d="M 85 24 C 68 16, 44 13, 22 19 C 38 25, 56 27, 74 30 C 51 33, 32 38, 20 43 C 38 44, 58 42, 76 38 Z" 
                      fill="url(#p-bg-${c.id})" opacity="0.6"/>

                <path d="M 150 22 C 170 12, 198 8, 224 16 C 212 22, 198 26, 182 28 C 204 28, 220 33, 230 41 C 216 42, 196 42, 174 39 C 192 44, 208 50, 216 56 C 198 54, 176 49, 155 40 Z" 
                      fill="url(#p-border-${c.id})" opacity="0.9"/>
                <path d="M 155 24 C 172 16, 196 13, 218 19 C 202 25, 184 27, 166 30 C 189 33, 208 38, 220 43 C 202 44, 182 42, 164 38 Z" 
                      fill="url(#p-bg-${c.id})" opacity="0.6"/>
            </g>

            <!-- KIẾM THẦN ĐAN CHÉO -->
            <g class="badge-swords" opacity="0.85">
                <line x1="98" y1="5" x2="142" y2="32" stroke="${c.cLight}" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="95" y1="3" x2="101" y2="7" stroke="${c.cMid}" stroke-width="4" stroke-linecap="round"/>
                <line x1="142" y1="5" x2="98" y2="32" stroke="${c.cLight}" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="145" y1="3" x2="139" y2="7" stroke="${c.cMid}" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- ĐUÔI RUY BĂNG -->
            <g class="badge-tails">
                <path d="M 26 33 L 6 43 L 22 51 L 6 59 L 30 56 L 42 46 Z" fill="url(#p-bg-${c.id})" stroke="${c.strokeColor}" stroke-width="1.2"/>
                <path d="M 214 33 L 234 43 L 218 51 L 234 59 L 210 56 L 198 46 Z" fill="url(#p-bg-${c.id})" stroke="${c.strokeColor}" stroke-width="1.2"/>
            </g>

            <!-- THÂN DẢI LỤA BẢNG TÊN CHÍNH -->
            <path d="M 32 30 C 72 23, 168 23, 208 30 C 216 31, 218 36, 216 43 L 210 55 C 208 59, 202 61, 196 60 C 154 56, 86 56, 44 60 C 38 61, 32 59, 30 55 L 24 43 C 22 36, 24 31, 32 30 Z" 
                  fill="url(#p-bg-${c.id})" stroke="url(#p-border-${c.id})" stroke-width="2.2" filter="url(#p-glow-${c.id})"/>

            <!-- Khung viền chỉ vàng kim bên trong -->
            <path d="M 36 33 C 74 28, 166 28, 204 33 L 205 44 L 200 54 C 154 51, 86 51, 40 54 L 35 44 Z" 
                  fill="none" stroke="${c.cLight}" stroke-width="0.8" opacity="0.6"/>

            <!-- Đinh tán góc -->
            <circle cx="40" cy="45" r="1.8" fill="${c.cLight}"/>
            <circle cx="200" cy="45" r="1.8" fill="${c.cLight}"/>

            <!-- LINH VẬT CHIẾN LANG ĐỈNH ĐẦU -->
            <g class="badge-crest" transform="translate(120, 16)">
                <!-- Vương miện đỉnh -->
                <path d="M -14 -4 L -8 -12 L 0 -7 L 8 -12 L 14 -4 L 10 2 L -10 2 Z" fill="url(#p-border-${c.id})" stroke="${c.cLight}" stroke-width="1"/>
                <!-- Khiên tròn -->
                <circle cx="0" cy="2" r="12" fill="url(#p-bg-${c.id})" stroke="url(#p-border-${c.id})" stroke-width="2"/>
                <circle cx="0" cy="2" r="9.5" fill="none" stroke="${c.cLight}" stroke-width="0.8" stroke-dasharray="2 1" opacity="0.8"/>
                <!-- Đầu sói/miêu cách điệu -->
                <path d="M -5 -2 L -8 5 L -3 7 L 0 4 L 3 7 L 8 5 L 5 -2 L 3 1 L 0 -1 L -3 1 Z" fill="${c.cLight}"/>
                <!-- Ngọc bảo -->
                <polygon points="0,-4 3,-1 0,2 -3,-1" fill="${c.gemColor}"/>
            </g>

            <!-- CHỮ DANH HIỆU INGAME 3D -->
            <text x="120" y="49" 
                  text-anchor="middle" 
                  font-family="'Montserrat', 'Arial Black', sans-serif" 
                  font-weight="900" 
                  font-size="11.5" 
                  letter-spacing="1.2"
                  stroke="${c.textStroke}" 
                  stroke-width="4.5" 
                  stroke-linejoin="round"
                  paint-order="stroke fill"
                  fill="url(#p-text-${c.id})">${mainTitle}</text>
        </svg>
        `;
    }

    const titlesData = [
        { tier: 'platinum', label: 'TOP 1 (BẠCH KIM)', title: 'BẠCH THÁNH KIM TÔN' },
        { tier: 'darkgold', label: 'TOP 2 (HẮC KIM)', title: 'HẮC ĐẾ THƯỢNG TÔN' },
        { tier: 'gold', label: 'TOP 3 (HOÀNG KIM)', title: 'HOÀNG KIM LANG TƯỚNG' },
        { tier: 'silver', label: 'TOP 4 (BẠCH NGÂN)', title: 'BẠCH NGÂN LANG TƯỚNG' },
        { tier: 'bronze', label: 'TOP 5 (XÍCH ĐỒNG)', title: 'XÍCH ĐỒNG LANG TƯỚNG' }
    ];

    const plaquesContainer = document.getElementById('plaques-row');
    titlesData.forEach(d => {
        const wrap = document.createElement('div');
        wrap.className = 'plaque-wrapper';
        wrap.innerHTML = `
            <span class="plaque-tier-label">${d.label}</span>
            ${renderPlaqueSvg(d.tier, d.title)}
        `;
        plaquesContainer.appendChild(wrap);
    });

    // Mẫu 10 thành viên Top 6 đến Top 15
    const elite10 = [
        { stt: 6, name: "SW ⚜️ NTTP 🇻🇳", power: "271.1B", title: "Thái phó", note: "Tinh anh", stage: "6200", tower: "1420" },
        { stt: 7, name: "SW ⚜️ 1701 🇻🇳", power: "258.5B", title: "Thái phó", note: "Tinh anh", stage: "5900", tower: "1380" },
        { stt: 8, name: "SW ⚜️ Bi Tiên", power: "254.5B", title: "Thái phó", note: "Tinh anh", stage: "5800", tower: "1350" },
        { stt: 9, name: "SW ⭐️ Haruki", power: "233.1B", title: "Thái úy", note: "Tinh anh", stage: "5400", tower: "1260" },
        { stt: 10, name: "SW • ĐỘLiVi", power: "231.8B", title: "Thái úy", note: "Tinh anh", stage: "5350", tower: "1240" },
        { stt: 11, name: "SW • Rain", power: "220B", title: "Vệ Tướng Quân", note: "Thành viên", stage: "5100", tower: "1180" },
        { stt: 12, name: "SW ღ Rin ღ", power: "200B", title: "Vệ Tướng Quân", note: "Thành viên", stage: "4900", tower: "1120" },
        { stt: 13, name: "SW ⚜️ Ryo 🇻🇳", power: "197.7B", title: "Thái phó", note: "Thành viên", stage: "4850", tower: "1100" },
        { stt: 14, name: "0379318347", power: "195.7B", title: "Vệ Tướng Quân", note: "Thành viên", stage: "4800", tower: "1080" },
        { stt: 15, name: "SW ⚜️ Neko", power: "188.9B", title: "Thái úy", note: "Thành viên", stage: "4750", tower: "1050" }
    ];

    const eliteGrid = document.getElementById('elite-grid');
    elite10.forEach(m => {
        let shieldClass = 'rank-shield-silver';
        let shieldIcon = '<i class="fa-solid fa-shield"></i>';
        if (m.stt <= 8) {
            shieldClass = 'rank-shield-diamond';
            shieldIcon = '<i class="fa-solid fa-crown"></i>';
        } else if (m.stt <= 10) {
            shieldClass = 'rank-shield-gold';
            shieldIcon = '<i class="fa-solid fa-star"></i>';
        }

        const card = document.createElement('div');
        card.className = 'elite-member-card';
        card.innerHTML = `
            <span class="card-corner corner-tl"></span>
            <span class="card-corner corner-tr"></span>
            <span class="card-corner corner-bl"></span>
            <span class="card-corner corner-br"></span>

            <div class="elite-card-topbar">
                <span class="elite-rank-shield ${shieldClass}">
                    ${shieldIcon} #${m.stt < 10 ? '0' + m.stt : m.stt}
                </span>
                <div class="elite-milestones-plate">
                    <span class="milestone-pill pill-stage" title="Ải"><i class="fa-solid fa-mountain"></i> ${m.stage}</span>
                    <span class="milestone-pill pill-tower" title="Tháp"><i class="fa-solid fa-chess-rook"></i> ${m.tower}</span>
                </div>
            </div>

            <div class="elite-avatar-container">
                <div class="elite-avatar-ring">
                    <img src="images/logo.png" alt="${m.name}" class="elite-avatar-img">
                </div>
            </div>

            <div class="elite-name-text" title="${m.name}">${m.name}</div>

            <div class="elite-power-card-box">
                <i class="fa-solid fa-bolt power-bolt-icon"></i>
                <span class="power-number-text">${m.power}</span>
            </div>

            <div class="elite-tags-row">
                <span class="tag-badge tag-title">${m.title}</span>
                <span class="tag-badge tag-note">${m.note}</span>
            </div>

            <button class="elite-action-btn">
                <i class="fa-solid fa-paw"></i> Xem Đội Hình
            </button>
        `;
        eliteGrid.appendChild(card);
    });
